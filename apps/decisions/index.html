<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decisions</title>
    <script>
      // Apply the stored theme before the bundle loads, so a dark page never
      // flashes light. Mirrors the theme service (src/services/theme).
      try {
        const stored = localStorage.getItem("decisions-theme");
        const dark =
          stored === "dark" ||
          (stored !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
