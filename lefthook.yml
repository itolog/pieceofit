pre-commit:
  parallel: true
  jobs:
    - name: lint & format
      group:
        jobs:
          - name: lint
            run: bunx oxlint --fix {staged_files}
            glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"
            stage_fixed: true

          - name: format
            run: bunx oxfmt --write {staged_files}
            glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,md}"
            stage_fixed: true

    - name: check-types
      run: bun run check-types

    - name: check-unused
      run: bunx turbo run check-unused

pre-push:
  parallel: true
  jobs:
    - name: audit
      run: bun run deps:audit

    - name: test:unit
      run: bun run test:unit
