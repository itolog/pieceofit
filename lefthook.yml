pre-commit:
  parallel: true
  jobs:
    - name: lint & format
      group:
        jobs:
          - name: lint
            run: bunx oxlint {staged_files}
            glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts}"

          - name: format
            run: bunx oxfmt --check {staged_files}
            glob: "*.{js,jsx,mjs,cjs,ts,tsx,mts,cts,json,jsonc,md}"

    - name: check-types
      run: bun run check-types

    - name: check-unused
      run: bun run check-unused

pre-push:
  parallel: true
  jobs:
    - name: audit
      run: bun run deps:audit

    - name: test:unit
      run: bun run test:unit
